kind = "web"
previewPath = "/"
title = "Abdallah Yahia Chat"
version = "1.0.0"
id = "artifacts/ay-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21764

[services.development]
run = "pnpm --filter @workspace/ay-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ay-chat", "run", "build" ]
publicDir = "artifacts/ay-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21764"
BASE_PATH = "/"
